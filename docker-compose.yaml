services:
  secret-init:
    image: alpine:3.20
    restart: "no"
    labels:
      cc.fiwu.abook.cleanup.role: "secret-init-v1"
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -s /run/abook/app_secret ]; then
          umask 077
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /run/abook/app_secret
        fi
    volumes:
      - app_secret:/run/abook
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: abook
      MYSQL_USER: abook
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-abook_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment: &backend_env
      DATABASE_URL: mysql+pymysql://abook:${MYSQL_PASSWORD:-abook_dev_password}@mysql:3306/abook?charset=utf8mb4
      CELERY_BROKER_URL: redis://redis:6379/0
      APP_SECRET: ${APP_SECRET:-}
      APP_SECRET_FILE: /run/abook/app_secret
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345678}
      PROVIDER_CATALOG_AUTO_REFRESH: "1"
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - uploads:/app/data/uploads
      - app_secret:/run/abook:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      secret-init: { condition: service_completed_successfully }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=INFO --concurrency=${WORKER_CONCURRENCY:-2}
    environment: *backend_env
    volumes:
      - uploads:/app/data/uploads
      - app_secret:/run/abook:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      secret-init: { condition: service_completed_successfully }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
  beat:
    build: ./backend
    command: celery -A app.tasks.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    environment: *backend_env
    volumes:
      - app_secret:/run/abook:ro
    depends_on:
      secret-init: { condition: service_completed_successfully }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      - backend
volumes:
  mysql_data:
  uploads:
  app_secret:
